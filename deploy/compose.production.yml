services:
  grist-production:
    image: ${GRIST_IMAGE:?Set GRIST_IMAGE to a pinned Grist image}
    restart: unless-stopped
    environment:
      APP_HOME_URL: ${GRIST_PRODUCTION_URL:?Set GRIST_PRODUCTION_URL}
      GRIST_SESSION_SECRET: ${GRIST_SESSION_SECRET:?Set GRIST_SESSION_SECRET}
      GRIST_FORCE_LOGIN: "true"
      GRIST_SINGLE_ORG: ${GRIST_SINGLE_ORG:-punchdeck}
      GRIST_SANDBOX_FLAVOR: ${GRIST_SANDBOX_FLAVOR:-gvisor}
    volumes:
      - ${GRIST_PRODUCTION_PERSIST_DIR:?Set GRIST_PRODUCTION_PERSIST_DIR}:/persist
    ports:
      - "127.0.0.1:8486:8484"

  punchdeck-ingestion-production:
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      GRIST_BASE_URL: http://grist-production:8484
      NODE_ENV: production
    depends_on:
      - grist-production

  punchdeck-admin-production:
    build:
      context: ..
    command: ["node", "dist/admin-gateway.js"]
    restart: unless-stopped
    environment:
      ADMIN_GATEWAY_HOST: 0.0.0.0
      ADMIN_GATEWAY_PORT: 3000
      GRIST_ORIGIN: http://grist-production:8484
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:8488:3000"
    depends_on:
      - grist-production
